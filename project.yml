name: TechKadak
options:
  bundleIdPrefix: in.techkadak
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TechKadak:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: TechKadak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.techkadak.app
        PRODUCT_NAME: TechKadak
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TechKadak/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
